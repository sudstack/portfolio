<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        body::after { display: none !important; }

        body {
            margin: 0;
            padding: 3rem;
            color: var(--color-text-main);
            font-family: var(--font-main);
            background: transparent !important;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 3rem;
            height: calc(100vh - 6rem);
            align-items: center;
        }

        .media-side {
            flex: 1;
            aspect-ratio: 16 / 9;
            max-height: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }

        .media-side video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .content-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            color: var(--color-accent);
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: var(--color-text-body);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .tags {
            margin-top: 2rem;
        }

        .tag {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(var(--color-accent-rgb), 0.2);
            color: var(--color-accent);
            border: 1px solid rgba(var(--color-accent-rgb), 0.5);
            border-radius: 20px;
            margin-right: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .media-side {
                width: 100%;
                aspect-ratio: 16 / 9;
                height: auto;
            }
            body {
                overflow-y: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <div class="media-side">
            <video controls autoplay loop muted playsinline>
                <source src="../assets/cryptoplay/CryptoPlay.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="content-side">
            <h2>Cryptoplay</h2>
            <p>A fun RPG game where user build their own empire using crypto trading and completing tasks within the game world.</p>
            <div class="tags">
                <span class="tag">Unity Graphs</span>
                <span class="tag">RPG Game</span>
                <span class="tag">Empire Building</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            if (window.parent && window.frameElement) {
                const rect = window.frameElement.getBoundingClientRect();
                const parentX = e.clientX + rect.left;
                const parentY = e.clientY + rect.top;
                window.parent.document.body.style.setProperty('--mouse-x', `${parentX}px`);
                window.parent.document.body.style.setProperty('--mouse-y', `${parentY}px`);
            }
        });
    </script>
</body>

</html>
