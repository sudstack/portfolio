<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        body::after { display: none !important; }

        body {
            margin: 0;
            padding: 3rem;
            color: var(--color-text-main);
            font-family: var(--font-main);
            background: transparent !important;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 3rem;
            height: calc(100vh - 6rem);
            align-items: center;
        }

        .media-side {
            flex: 0 0 auto;
            height: 100%;
            aspect-ratio: 1 / 2;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }

        .media-side img, .media-side video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .media-side .active {
            opacity: 1;
            z-index: 1;
        }

        .content-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            color: var(--color-accent);
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: var(--color-text-body);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .tags {
            margin-top: 2rem;
        }

        .tag {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(var(--color-accent-rgb), 0.2);
            color: var(--color-accent);
            border: 1px solid rgba(var(--color-accent-rgb), 0.5);
            border-radius: 20px;
            margin-right: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .media-side {
                height: 40vh;
                width: 100%;
            }
            body {
                overflow-y: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <div class="media-side" id="media-container">
            <!-- Media will be injected here -->
        </div>
        <div class="content-side">
            <h2>Cambio</h2>
            <p>A competetive mobile board game which is an extended version of popular Tic-Tac-Toe, built with Photon PUN2 for realtime 
                multiplayer experiences, platform auth, and production-ready release work.</p>
            <div class="tags">
                <span class="tag">Multiplayer</span>
                <span class="tag">Photon PUN2</span>
                <span class="tag">Unity</span>
                <span class="tag">Firebase</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            if (window.parent && window.frameElement) {
                const rect = window.frameElement.getBoundingClientRect();
                const parentX = e.clientX + rect.left;
                const parentY = e.clientY + rect.top;
                window.parent.document.body.style.setProperty('--mouse-x', `${parentX}px`);
                window.parent.document.body.style.setProperty('--mouse-y', `${parentY}px`);
            }
        });

        // Media Carousel Logic
        const mediaItems = [
            { type: 'image', src: '../assets/cambio/cambio-img1.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img2.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img3.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img4.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img5.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img6.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img7.png', duration: 3000 },
            { type: 'image', src: '../assets/cambio/cambio-img8.png', duration: 3000 },
            { type: 'video', src: '../assets/cambio/cambio-video.mp4', duration: 200000 },
        ];

        const container = document.getElementById('media-container');
        const elements = [];

        // Initialize elements
        mediaItems.forEach((item, index) => {
            let el;
            if (item.type === 'video') {
                el = document.createElement('video');
                el.src = item.src;
                el.muted = true;
                el.playsInline = true;
                el.loop = true; 
            } else {
                el = document.createElement('img');
                el.src = item.src;
            }
            if (index === 0) el.classList.add('active');
            container.appendChild(el);
            elements.push(el);
        });

        let currentIndex = 0;
        let timeoutId = null;

        function showNextMedia() {
            // Hide current
            elements[currentIndex].classList.remove('active');
            if (mediaItems[currentIndex].type === 'video') {
                elements[currentIndex].pause();
                elements[currentIndex].currentTime = 0; // reset
            }

            // Move to next
            currentIndex = (currentIndex + 1) % mediaItems.length;
            const nextItem = mediaItems[currentIndex];
            const nextEl = elements[currentIndex];

            nextEl.classList.add('active');
            
            if (nextItem.type === 'video') {
                nextEl.play().catch(e => console.log("Video autoplay blocked", e));
            }

            timeoutId = setTimeout(showNextMedia, nextItem.duration);
        }

        // Start the carousel
        if (mediaItems.length > 0) {
            const firstItem = mediaItems[0];
            const firstEl = elements[0];
            if (firstItem.type === 'video') {
                firstEl.play().catch(e => console.log("Video autoplay blocked", e));
            }
            timeoutId = setTimeout(showNextMedia, firstItem.duration);
        }
    </script>
</body>

</html>
